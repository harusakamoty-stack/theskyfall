name: Update hail risk data

# 15分ごとに気象庁・Open-Meteoの実データを取得して指数を再計算し、
# data/risk-data.json をリポジトリに直接コミットする。
# Netlifyの利用制限に達したため、Netlify Functions + Netlify Blobsから
# GitHub Actions + リポジトリ内静的JSONの構成に移行した。
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# 前回の実行が15分以内に終わらなかった場合、古い実行を待たずに
# キャンセルして最新の実行だけを進める（実行が積み重なるのを防ぐ）。
concurrency:
  group: update-risk-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate risk data
        run: node scripts/generate-risk-data.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to data/"
          else
            git commit -m "chore: update risk data ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
            git push
          fi
